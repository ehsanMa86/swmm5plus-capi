name: Bug report
description: A model, build or API call that does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. If the model also fails with the SWMM5+ executable itself, please report it upstream at https://github.com/CIMM-ORG/SWMM5plus as well.
  - type: input
    id: version
    attributes:
      label: swmm5plus-capi version
      description: The release you downloaded, or the commit you built.
      placeholder: "0.2.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x86_64
        - macOS arm64 (Apple silicon)
        - macOS x86_64 (Intel)
        - Linux x86_64
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host application and compiler
      description: For example "Mirab 0.2.1", or your own program and the compiler you built swmm5plus-capi with.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The calls you made, what you expected and what happened instead, with the return codes and messages.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Input file
      description: Attach the smallest .inp file that shows the problem, if you can share it.
